name: Build Release

on:
  workflow_dispatch:
  workflow_call: # Required for orchestration

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Get App Version
        id: app_version
        shell: pwsh
        run: |
          $version = Get-Content version.txt -Raw
          $version = $version.Trim()
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Get Python version
        id: python-version
        run: |
          $pythonVersion = (python --version).Split(" ")[1]
          echo "version=$pythonVersion" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ steps.python-version.outputs.version }}

      - name: Install build tools
        run: pip install pyinstaller

      - name: Install dependencies
        run: pip install pywin32 PyQt6

      - name: Generate requirements.txt
        shell: pwsh
        run: |
          $reqs = pip freeze | Select-String "pywin32", "PyQt6"
          $reqs = $reqs -join "`n"
          [System.IO.File]::WriteAllText("requirements.txt", $reqs)

      - name: Commit requirements.txt
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'feat(build): update requirements.txt with exact versions'
          file_pattern: requirements.txt

      - name: Set up UPX
        run: choco install upx -y

      - name: Build EXE
        run: pyinstaller compile.spec

      - name: Create artifact folder
        shell: pwsh
        run: |
          if (!(Test-Path artifact_contents)) { mkdir artifact_contents }
          move dist\desktop-icon-backup-manager_*.exe "artifact_contents/Desktop Icon Backup Manager.exe"

      - name: Save ZIP artifact
        uses: actions/upload-artifact@v5
        with:
          name: desktop-icon-backup-manager_v${{ steps.app_version.outputs.version }}
          path: artifact_contents/

      - name: Create Release ZIP
        shell: pwsh
        run: Compress-Archive -Path artifact_contents/* -DestinationPath desktop-icon-backup-manager_v${{ steps.app_version.outputs.version }}.zip -Force

      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          $zipFile = "desktop-icon-backup-manager_v${{ steps.app_version.outputs.version }}.zip"
          $hash = (Get-FileHash $zipFile -Algorithm SHA256).Hash.ToLower()
          $checksumLine = "$hash  $zipFile"
          $checksumFile = "desktop-icon-backup-manager_v${{ steps.app_version.outputs.version }}.zip.sha256"
          [System.IO.File]::WriteAllText($checksumFile, $checksumLine)
          Write-Host "SHA256: $checksumLine"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop-icon-backup-manager_v${{ steps.app_version.outputs.version }}.zip
            desktop-icon-backup-manager_v${{ steps.app_version.outputs.version }}.zip.sha256
          tag_name: v${{ steps.app_version.outputs.version }}
          name: Release v${{ steps.app_version.outputs.version }}
          body: |
            [![☕ Liked this tool? Buy me a coffee! — ko-fi.com/mapi68](https://img.shields.io/badge/-%E2%98%95%20Liked%20this%20tool%3F%20%20Buy%20me%20a%20coffee!%20%E2%80%94%20ko--fi.com%2Fmapi68-FF5E5B?style=for-the-badge&logo=ko-fi&logoColor=white&labelColor=1a1a2e)](https://ko-fi.com/mapi68)

            > **Verify integrity:** download the `.sha256` file and run:
            > ```
            > certutil -hashfile desktop-icon-backup-manager_v${{ steps.app_version.outputs.version }}.zip SHA256
            > ```
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
