name: Deploy Website Only (reuse existing PDF)

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'web/**' # Only trigger when files inside web/ change

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy_website:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare Pages folder
        run: |
          mkdir -p _site
          cp -r web/* _site/

      - name: Download the currently published manual.pdf
        run: |
          curl -f -o _site/manual.pdf https://mapi68.github.io/desktop-icon-backup-manager/manual.pdf

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
